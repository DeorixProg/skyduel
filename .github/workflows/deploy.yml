name: Deploy

# A tag v* builds the image, publishes it to GHCR and deploys it.
# The CI workflow still gates every push; this one only runs for releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
      - name: Image size (README asks for < 200 MB)
        run: |
          docker pull "${{ steps.meta.outputs.image }}:${{ github.ref_name }}"
          docker image inspect "${{ steps.meta.outputs.image }}:${{ github.ref_name }}" --format '{{.Size}}' \
            | awk '{ printf "### Image size: %.1f MB\n", $1/1048576 }' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TARGET == 'fly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --image "${{ needs.image.outputs.image }}:${{ github.ref_name }}" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: The live /health must report the tag's commit
        run: |
          sleep 20
          sha=$(curl -fsS https://skyduel.fly.dev/health | jq -r .version)
          echo "live version: $sha, tag commit: ${GITHUB_SHA:0:12}"
          test "$sha" = "${GITHUB_SHA:0:12}"
