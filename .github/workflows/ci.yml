name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc --noEmit, strict, all packages)
        run: npm run typecheck
      - name: Lint (Biome)
        run: npm run lint
      - name: Unit tests (shared + server)
        run: npm test
      - name: Build client
        run: npm run build
