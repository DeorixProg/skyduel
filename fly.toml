# Fly.io: one machine on purpose — all players of a room must be in ONE process
# (the match lives in memory). See README "Обмеження".
app = "skyduel"
primary_region = "waw"

[build]
  image = "ghcr.io/deorixprog/skyduel:latest"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  ALLOWED_ORIGINS = "https://skyduel.fly.dev"
  MAX_CONNECTIONS_PER_IP = "8"
  TRUST_PROXY = "1"           # Fly's proxy sets the real client IP in X-Forwarded-For

[http_service]
  internal_port = 8080
  force_https = true          # the page is https, so the socket is wss://
  auto_stop_machines = "off"  # a stopped machine would drop every live match
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

kill_signal = "SIGTERM"
kill_timeout = "10s"
