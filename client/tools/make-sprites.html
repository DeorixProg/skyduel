<!doctype html>
<meta charset="utf-8" />
<title>sprite sheet generator</title>
<canvas id="c"></canvas>
<script type="module">
  // Renders the vector art from src/render/draw.js into one sprite sheet (2x resolution).
  import { drawBalloon, drawBullet, drawPickup, drawShip } from "/src/render/draw.js";

  const CELL = 128, SCALE = 2;
  const COLORS = ["#c0392b", "#2c3e50", "#27ae60", "#d4ac0d", "#8e44ad", "#d35400"];
  const cells = [];
  COLORS.forEach((color, i) => {
    cells.push([`ship${i}`, (ctx) => drawShip(ctx, { x: 0, y: 0, angle: 0, thrust: false }, { color, time: 0.013 })]);
    cells.push([`ship${i}_thrust`, (ctx) => drawShip(ctx, { x: 0, y: 0, angle: 0, thrust: true }, { color, time: 0.013 })]);
  });
  const P = { x: 0, y: 0 };
  cells.push(["bullet", (ctx) => drawBullet(ctx, { pos: P, angle: 0 })]);
  cells.push(["bullet_homing", (ctx) => drawBullet(ctx, { pos: P, angle: 0, homing: {} })]);
  cells.push(["balloon", (ctx) => drawBalloon(ctx, { pos: P, radius: 28 })]);
  cells.push(["balloon_hunter", (ctx) => drawBalloon(ctx, { pos: P, radius: 28, homing: {} })]);
  for (const effect of ["shield", "rapid", "homing"])
    cells.push([`pickup_${effect}`, (ctx) => drawPickup(ctx, { pos: P, angle: 0, pickup: { effect } })]);

  const COLS = 6;
  const c = document.getElementById("c");
  c.width = COLS * CELL;
  c.height = Math.ceil(cells.length / COLS) * CELL;
  const ctx = c.getContext("2d");
  const atlas = { cell: CELL, scale: SCALE, frames: {} };
  cells.forEach(([name, draw], i) => {
    const sx = (i % COLS) * CELL, sy = Math.floor(i / COLS) * CELL;
    ctx.save();
    ctx.translate(sx + CELL / 2, sy + CELL / 2);
    ctx.scale(SCALE, SCALE);
    draw(ctx);
    ctx.restore();
    atlas.frames[name] = { x: sx, y: sy, w: CELL, h: CELL };
  });
  window.__sheet = { png: c.toDataURL("image/png"), atlas };
</script>
